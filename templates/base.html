<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="{% block title_key %}meta.title{% endblock %}">{% block title %}Lontaras{% endblock %}</title>
  <meta name="description" data-i18n-attr="content:{% block desc_key %}meta.desc{% endblock %}" content="{% block description %}Aplikasi web, software desktop, dan sistem AI buatan Makassar.{% endblock %}">
  <meta name="theme-color" content="#F6EFE4">
  <script>
    // Set tema sebelum render supaya tidak berkedip.
    (function () {
      try {
        var t = localStorage.getItem("lontaras-theme");
        if (t !== "dark" && t !== "light") t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
        var m = document.querySelector('meta[name="theme-color"]');
        if (m) m.setAttribute("content", t === "dark" ? "#1A1411" : "#F6EFE4");
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..800;1,9..144,300..800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="top">
    <a class="brand" href="{{ url_for('index') }}">Lontaras</a>
    <nav class="menu" aria-label="Navigasi utama" data-i18n-attr="aria-label:nav.label">
      <a href="{{ url_for('index') }}#layanan" data-i18n="nav.services">Layanan</a>
      <a href="{{ url_for('index') }}#produk" data-i18n="nav.products">Produk</a>
      <a href="{{ url_for('index') }}#cara-kerja" data-i18n="nav.how">Cara kerja</a>
      <a class="pill" href="{{ url_for('index') }}#kontak" data-i18n="nav.contact">Hubungi saya</a>
      <div class="lang" role="group" aria-label="Bahasa / Language">
        <button type="button" data-set-lang="id" aria-pressed="true">ID</button>
        <button type="button" data-set-lang="en" aria-pressed="false">EN</button>
      </div>
      <button type="button" class="theme" id="theme-toggle" data-i18n-attr="aria-label:theme.toggle" aria-label="Ganti tema gelap/terang">
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>
      </button>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <div class="songket" aria-hidden="true"></div>
  <footer class="foot">
    <div class="foot-word" aria-hidden="true">Lontaras</div>
    <div class="foot-row">
      <span>&copy; 2026 [Nama PT]</span>
      <span data-i18n="foot.place">Makassar, Sulawesi Selatan</span>
      <span>5°09′S 119°26′E</span>
    </div>
    <nav class="foot-links" aria-label="Legal" data-i18n-attr="aria-label:foot.legal">
      <a href="{{ url_for('privacy') }}" data-i18n="foot.privacy">Kebijakan Privasi</a>
      <a href="{{ url_for('terms') }}" data-i18n="foot.terms">Syarat Layanan</a>
    </nav>
  </footer>

  <script src="{{ url_for('static', filename='js/i18n.js') }}"></script>
  <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</body>
</html>
