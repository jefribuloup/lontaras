<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Lontaras{% endblock %}</title>
  <meta name="description" content="{% block description %}Aplikasi web, software desktop, dan sistem AI buatan Makassar.{% endblock %}">
  <meta name="theme-color" content="#F6EFE4">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Young+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="top">
    <a class="brand" href="{{ url_for('index') }}">Lontaras</a>
    <nav class="menu" aria-label="Navigasi utama">
      <a href="{{ url_for('index') }}#layanan">Layanan</a>
      <a href="{{ url_for('index') }}#produk">Produk</a>
      <a href="{{ url_for('index') }}#cara-kerja">Cara kerja</a>
      <a class="pill" href="{{ url_for('index') }}#kontak">Hubungi saya</a>
    </nav>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <div class="tepi" aria-hidden="true"></div>
  <footer class="foot">
    <div class="foot-word" aria-hidden="true">Lontaras</div>
    <div class="foot-row">
      <span>&copy; 2026 [Nama PT]</span>
      <span>Makassar, Sulawesi Selatan</span>
      <span>5°09′S 119°26′E</span>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</body>
</html>
