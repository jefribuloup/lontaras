<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Lontaras{% endblock %}</title>
  <meta name="description" content="{% block description %}Website resmi [Nama PT].{% endblock %}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a class="brand" href="{{ url_for('index') }}">Lontaras</a>
      <nav>
        <a href="{{ url_for('index') }}#tentang">Tentang</a>
        <a href="{{ url_for('index') }}#layanan">Layanan</a>
        <a href="{{ url_for('index') }}#kontak">Kontak</a>
      </nav>
    </div>
  </header>

  <main>
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>&copy; 2026 [Nama PT]. Seluruh hak dilindungi.</p>
    </div>
  </footer>

  <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
</body>
</html>
